services:
  - type: web
    name: cognera-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cognera-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        fromService:
          name: cognera-web
          type: web
          property: host
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEV_LOGIN
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:admin@cognera.health"

  - type: web
    name: cognera-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://cognera-api-kh4a.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        fromService:
          name: cognera-api
          type: web
          envVarKey: GOOGLE_CLIENT_ID
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: cognera-db
    plan: free
    databaseName: cognera
